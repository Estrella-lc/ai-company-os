name: Film edit synthetic validation
on:
  pull_request:
    paths:
      - 'sandbox/film/**'
      - '.github/workflows/film-edit-check.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s sandbox/film -p test_render_plan.py
      - run: python3 sandbox/film/make_fixture.py "$RUNNER_TEMP/film-input"
      - run: docker build -t company-film-fixture sandbox/film
      - name: Render synthetic fixture in isolation
        run: |
          mkdir -p "$RUNNER_TEMP/film-output"
          chmod 777 "$RUNNER_TEMP/film-output"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 1g --cpus 2 --user 65534:65534 --tmpfs /tmp:rw,noexec,nosuid,size=128m -v "$PWD/sandbox/film:/adapter:ro" -v "$RUNNER_TEMP/film-input:/input:ro" -v "$RUNNER_TEMP/film-output:/out:rw" company-film-fixture
          cat "$RUNNER_TEMP/film-output/verification.json"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-film-technical-report
          path: ${{ runner.temp }}/film-output/verification.json
          retention-days: 1
