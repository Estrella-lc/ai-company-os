name: Creative CPU adapter validation
on:
  pull_request:
    paths:
      - 'sandbox/creative/**'
      - 'ai-company-os-web/scripts/creative-runner.mjs'
      - '.github/workflows/creative-check.yml'
permissions:
  contents: read
concurrency:
  group: creative-fixture-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  synthetic-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/company-creative-model-cache
          key: creative-public-models-${{ hashFiles('sandbox/creative/creative.py', 'sandbox/creative/requirements.txt') }}
      - name: Research public technology and generate offline synthetic samples
        run: node --input-type=module -e 'import {runCreativeFixture} from "./ai-company-os-web/scripts/creative-runner.mjs"; await runCreativeFixture(process.env.RUNNER_TEMP+"/creative-synthetic-evidence");'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creative-synthetic-fixture
          path: ${{ runner.temp }}/creative-synthetic-evidence
          if-no-files-found: ignore
          retention-days: 1
