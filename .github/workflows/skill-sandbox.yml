name: Skill research sandbox
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: skill-research-sandbox
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            ai-company-os-web/scripts/skill-runner.mjs
            ai-company-os-web/scripts/skill-discovery.mjs
            ai-company-os-web/scripts/subtitle-delivery.mjs
            sandbox/subtitle
          sparse-checkout-cone-mode: false
      - name: Search, inspect and validate one capability
        run: node ai-company-os-web/scripts/skill-runner.mjs
      - name: Retain synthetic evidence briefly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-research-evidence
          path: ${{ runner.temp }}/ai-company-skill-evidence
          if-no-files-found: ignore
          retention-days: 1
