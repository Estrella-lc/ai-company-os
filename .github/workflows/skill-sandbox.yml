name: Skill research sandbox
on:
  workflow_dispatch:
    inputs:
      document_fixture:
        description: 'Only run synthetic document adapter tests; no private files or database claims'
        type: boolean
        default: false
      creative_fixture:
        description: 'Only validate synthetic CPU creative samples and warm public model cache; no database claims'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'sandbox/documents/**'
      - 'skills/document-processing/**'
      - 'ai-company-os-web/scripts/*document*.mjs'
      - 'ai-company-os-web/scripts/skill-runner.mjs'
      - '.github/workflows/skill-sandbox.yml'
  schedule:
    - cron: '0 */2 * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: skill-research-sandbox
  cancel-in-progress: false
jobs:
  research:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            ai-company-os-web/scripts/skill-runner.mjs
            ai-company-os-web/scripts/document-runner.mjs
            ai-company-os-web/scripts/skill-discovery.mjs
            ai-company-os-web/scripts/comfy-research.mjs
            ai-company-os-web/scripts/comfy-workflow-policy.mjs
            ai-company-os-web/scripts/subtitle-delivery.mjs
            ai-company-os-web/scripts/technology-discovery.mjs
            ai-company-os-web/scripts/technology-runner.mjs
            ai-company-os-web/scripts/creative-runner.mjs
            ai-company-os-web/scripts/film-runner.mjs
            ai-company-os-web/scripts/motion-runner.mjs
            ai-company-os-web/scripts/motion-provider.mjs
            sandbox/film
            sandbox/creative
            sandbox/integration
            sandbox/subtitle
            sandbox/documents
            skills/document-processing
          sparse-checkout-cone-mode: false
      - uses: actions/cache/restore@v4
        id: creative-model-cache
        with:
          path: ${{ runner.temp }}/company-creative-model-cache
          key: creative-public-models-${{ hashFiles('sandbox/creative/creative.py', 'sandbox/creative/requirements.txt') }}
      - name: Search, inspect and validate one capability
        env:
          DOCUMENT_FIXTURE: ${{ inputs.document_fixture }}
          CREATIVE_FIXTURE: ${{ inputs.creative_fixture }}
        run: |
          if [ "$CREATIVE_FIXTURE" = "true" ]; then
            node ai-company-os-web/scripts/skill-runner.mjs --creative-fixture
          elif [ "$DOCUMENT_FIXTURE" = "true" ]; then
            node ai-company-os-web/scripts/skill-runner.mjs --document-fixture
          else
            node ai-company-os-web/scripts/skill-runner.mjs
          fi
      - uses: actions/cache/save@v4
        if: always() && steps.creative-model-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/company-creative-model-cache
          key: creative-public-models-${{ hashFiles('sandbox/creative/creative.py', 'sandbox/creative/requirements.txt') }}
      - name: Retain synthetic evidence briefly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-research-evidence
          path: ${{ runner.temp }}/ai-company-skill-evidence
          if-no-files-found: ignore
          retention-days: 1
  document-fixture:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Search public skills and validate synthetic PDF and DOCX files
        run: node ai-company-os-web/scripts/skill-runner.mjs --document-fixture
      - name: Retain synthetic document evidence briefly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-fixture-evidence
          path: ${{ runner.temp }}/ai-company-skill-evidence
          if-no-files-found: ignore
          retention-days: 1

