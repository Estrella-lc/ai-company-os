name: Skill research sandbox
on:
  workflow_dispatch:
    inputs:
      document_fixture:
        description: 'Only run synthetic document adapter tests; no private files or database claims'
        type: boolean
        default: false
  schedule:
    - cron: '0 */2 * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: skill-research-sandbox
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            ai-company-os-web/scripts/skill-runner.mjs
            ai-company-os-web/scripts/document-runner.mjs
            ai-company-os-web/scripts/skill-discovery.mjs
            ai-company-os-web/scripts/subtitle-delivery.mjs
            ai-company-os-web/scripts/technology-discovery.mjs
            ai-company-os-web/scripts/technology-runner.mjs
            sandbox/integration
            sandbox/subtitle
            sandbox/documents
            skills/document-processing
          sparse-checkout-cone-mode: false
      - name: Search, inspect and validate one capability
        env:
          DOCUMENT_FIXTURE: ${{ inputs.document_fixture }}
        run: |
          if [ "$DOCUMENT_FIXTURE" = "true" ]; then
            node ai-company-os-web/scripts/skill-runner.mjs --document-fixture
          else
            node ai-company-os-web/scripts/skill-runner.mjs
          fi
      - name: Retain synthetic evidence briefly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-research-evidence
          path: ${{ runner.temp }}/ai-company-skill-evidence
          if-no-files-found: ignore
          retention-days: 1
